name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  policy:
    name: Project and packaging checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/check_project.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  engine:
    name: Engine / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DBUILD_TESTING=ON -DPRINTSHIFT_SANITIZERS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows x64 / ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel 2
      - name: Test engine, packaging, native resources, and capture preference
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
      - name: Create release-ready assets
        if: matrix.configuration == 'Release'
        env:
          PRINTSHIFT_TOOLCHAIN: Microsoft Visual Studio 2022 / MSVC / Release / x64
        run: python scripts/package.py --binary build/Release/PrintShift.exe --output dist
      - name: Verify packaged assets
        if: matrix.configuration == 'Release'
        run: python scripts/package.py --verify-only --output dist
      - name: Upload release-ready assets
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
