name: Bug report
description: Report a reproducible PrintShift issue.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows build, PrintShift version, keyboard model, active layout, and other remappers.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and shortcut expression
      description: Include the exact binding and inspector VK/scan values. Do not include sensitive typed input.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
